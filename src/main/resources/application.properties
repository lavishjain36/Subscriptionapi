spring.application.name=subscription
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/subscription}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
